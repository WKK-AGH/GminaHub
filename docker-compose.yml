services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: gminahub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: gminahub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gminahub-backend
    command: npm run dev
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://admin:secret@postgres:5432/gminahub
      PGHOST: postgres
      PGUSER: admin
      PGPASSWORD: secret
      PGDATABASE: gminahub
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: gminahub-frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    working_dir: /app
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: http://localhost:3000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
